[package]
name = "kimi-girl"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
description = "Kimi Girl — a desktop pet that walks on your Linux desktop"
[features]
unified = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["webp"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tempfile = "3.27.0"
zbus = "5"
wl-clipboard-rs = "0.9"
webp.workspace = true

zstd.workspace = true

ureq.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
fs2.workspace = true
