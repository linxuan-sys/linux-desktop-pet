[package]
name = "desktop-pet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "One native Wayland desktop pet, eight downloadable characters, and a Rust TUI"

[features]
default = ["unified"]
unified = []

[[bin]]
name = "pet"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["webp"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tempfile = "3.27.0"
zbus = "5"
wl-clipboard-rs = "0.9"
webp.workspace = true
zstd.workspace = true
ureq.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
fs2.workspace = true
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
libc = "0.2"
