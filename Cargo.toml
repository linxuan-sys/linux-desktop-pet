[workspace]
members = ["desktop-pet", "claude-girl", "dsh-girl", "codex-girl", "grok-girl", "qwen-girl", "gemini-girl", "glm-girl", "kimi-girl"]
resolver = "3"

[workspace.dependencies]
webp = { version = "0.3.1", default-features = false }
zstd = { version = "0.13.3", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
fs2 = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
